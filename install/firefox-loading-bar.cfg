// firefox-loading-bar: a real-progress loading bar for Firefox's address bar. (Firefox always skips this first line.)
// https://github.com/ZIGAG1999/firefox-loading-bar
//
// WHAT IT DOES
//   In each Firefox window, listens to the current tab's page-load progress and
//   passes it to userChrome.css, which draws the loading bar:
//     #urlbar[loadbar="loading" | "done"]   and   --loadbar-progress: 0 to 1
//   That's all. No network access, no files read or written, no data sent anywhere.
//
// HOW PROGRESS IS MEASURED
//   Firefox only reports byte totals to its interface now and then, so progress is
//   built from several real loading signals, like Chromium's bar:
//     start 10%  ->  page starts arriving 30%  ->  every sign of the page loading
//     something nudges it forward (toward 85%)  ->  page document finished 85%
//     ->  everything finished 100%.
//   Every step is caused by real loading activity, so when a site stalls, the bar stalls.
//
// WHERE IT LIVES
//   The Firefox install folder (e.g. C:\Program Files\Mozilla Firefox\firefox-loading-bar.cfg),
//   loaded by defaults/pref/firefox-loading-bar-prefs.js. Changing files there needs
//   admin rights, so other programs can't edit this script.
//
// UNDO
//   Delete both files and restart Firefox.

try {
  const WPL = Components.interfaces.nsIWebProgressListener;
  const logError = (e) => { try { console.error("[firefox-loading-bar]", e); } catch (_) {} };

  function setup(win) {
    const gBrowser = win.gBrowser;
    const urlbar = win.document.getElementById("urlbar");
    if (!gBrowser || !urlbar) return;

    // Tells userChrome.css the script is running.
    win.document.documentElement.setAttribute("loadbar-script", "true");

    let progress = 0;
    let doneTimer = 0;
    let lastNudge = 0;

    const loading = () => urlbar.getAttribute("loadbar") === "loading";

    // Progress only ever moves forward.
    const setProgress = (p) => {
      progress = Math.max(progress, Math.min(p, 1));
      urlbar.style.setProperty("--loadbar-progress", progress.toFixed(4));
    };

    // Park the bar at the left end, invisible, without animating.
    const reset = () => {
      win.clearTimeout(doneTimer);
      progress = 0;
      urlbar.removeAttribute("loadbar");
      urlbar.style.setProperty("--loadbar-progress", "0");
      urlbar.getBoundingClientRect(); // apply the parked position before the next change
    };

    const start = (initial) => {
      reset();
      urlbar.setAttribute("loadbar", "loading");
      setProgress(initial);
    };

    const finish = () => {
      if (!loading()) return;
      setProgress(1);
      urlbar.setAttribute("loadbar", "done");
      // After the fill-and-retract animation (~260 ms), go back to idle.
      doneTimer = win.setTimeout(() => {
        if (urlbar.getAttribute("loadbar") === "done") reset();
      }, 450);
    };

    // A small step toward 85% for each sign of loading activity.
    const nudge = () => {
      if (!loading()) return;
      const now = win.performance.now();
      if (now - lastNudge < 40) return; // at most ~25 steps per second
      lastNudge = now;
      setProgress(progress + (0.85 - progress) * 0.08);
    };

    const listener = {
      QueryInterface: ChromeUtils.generateQI(["nsIWebProgressListener", "nsISupportsWeakReference"]),
      onStateChange(webProgress, request, flags, status) {
        if (!webProgress) return;
        const topLevel = webProgress.isTopLevel;
        // Whole-page load of the current tab starting or ending.
        if (topLevel && (flags & WPL.STATE_IS_NETWORK)) {
          if (flags & WPL.STATE_START) { start(0.1); return; }
          if (flags & WPL.STATE_STOP) { finish(); return; }
        }
        // The page's own document finished (its images etc. may still be loading).
        if (topLevel && (flags & WPL.STATE_IS_DOCUMENT) && (flags & WPL.STATE_STOP) && loading()) {
          setProgress(0.85);
          return;
        }
        // Any resource starting or finishing is loading activity.
        nudge();
      },
      onProgressChange(webProgress, request, curSelf, maxSelf, curTotal, maxTotal) {
        if (!loading()) return;
        // Real amount loaded so far, mapped to 10-90% when Firefox knows the total.
        if (maxTotal > 0) setProgress(0.1 + 0.8 * Math.min(curTotal / maxTotal, 1));
        nudge();
      },
      onLocationChange(webProgress, request, location, flags) {
        // The new page has started arriving (not an in-page change like YouTube's).
        if (webProgress && webProgress.isTopLevel && loading() &&
            !(flags & WPL.LOCATION_CHANGE_SAME_DOCUMENT)) {
          setProgress(0.3);
        }
      },
      // Status messages ("Transferring data from...") and blocked trackers
      // are also signs the page is loading things.
      onStatusChange() { nudge(); },
      onSecurityChange() {},
      onContentBlockingEvent() { nudge(); },
    };
    gBrowser.addProgressListener(listener);

    // Switching tabs: show the new tab's state, not the old one's.
    gBrowser.tabContainer.addEventListener("TabSelect", () => {
      if (gBrowser.selectedTab.hasAttribute("busy")) start(0.3);
      else reset();
    });
  }

  // Runs once for every Firefox window when it finishes opening.
  Components.classes["@mozilla.org/observer-service;1"]
    .getService(Components.interfaces.nsIObserverService)
    .addObserver({
      observe(win) {
        try { setup(win); } catch (e) { logError(e); }
      },
    }, "browser-delayed-startup-finished");
} catch (e) {
  try { console.error("[firefox-loading-bar]", e); } catch (_) {}
}
